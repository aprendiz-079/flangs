<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Comandas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
    <div class="container">
        <h1>🍽️ Sistema de Comandas</h1>
        
        <h2>Nova Comanda</h2>
        <form id="create-order-form">
            <input type="text" id="clientName" placeholder="Nome do cliente" required>
            <button type="submit" class="btn-primary">Criar Comanda</button>
        </form>
        
        <h2>Comandas</h2>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Sel</th>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Crédito</th>
                    <th>Débito</th>
                    <th>Saldo</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orders-tbody">
                <tr><td colspan="7" class="loading">Carregando...</td></tr>
            </tbody>
        </table>
        
        <div class="actions">
            <button id="btn-open" class="btn-info">🔍 Abrir</button>
            <button id="btn-close" class="btn-warning">🔒 Fechar</button>
            <button id="btn-remove" class="btn-danger">🗑 Remover</button>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
