<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Confirmar Item</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="confirm">
    <div class="confirm-card">
        <h2>📋 Confirmar Item</h2>
        
        <div class="item-info">
            <div id="item-name" class="item-name"></div>
            <div id="item-price" class="item-price"></div>
        </div>
        
        <form id="confirm-form">
            <input type="hidden" id="unitPrice">
            
            <label>Quantidade:</label>
            <div class="qty-control">
                <button type="button" id="btn-minus" class="qty-btn">-</button>
                <input type="number" id="quantity" class="qty-input" value="1" min="1" required>
                <button type="button" id="btn-plus" class="qty-btn">+</button>
            </div>
            
            <div class="total-preview">
                Total: R$ <span id="totalPreview">0.00</span>
            </div>
            
            <div class="payment-option">
                <label><input type="radio" name="paid" value="false" checked> À pagar (débito)</label><br>
                <label><input type="radio" name="paid" value="true"> Pago (crédito)</label>
            </div>
            
            <button type="submit" class="btn-confirm">✅ Confirmar</button>
        </form>
        
        <a href="#" id="cancel-link" class="btn-cancel">❌ Cancelar</a>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
